{% extends 'core/user_dashboard_master.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
            <h4 class="mb-sm-0">{{ page_title }}</h4>
        </div>
    </div>
</div>

{% if messages %}
<div class="row">
    <div class="col-12">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Profit Distribution</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="distribute_profit">
                    <div class="mb-3">
                        <label class="form-label">Current Total Invested (All Users)</label>
                        <input type="text" class="form-control" value="USDT {{ current_total_invested }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Total Amount (USDT)</label>
                        <input type="number" class="form-control" name="total_amount" min="0.01" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Note (optional)</label>
                        <textarea class="form-control" name="note" rows="2" placeholder="Optional note"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Distribute Profit</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
