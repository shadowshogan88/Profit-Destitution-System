{% extends 'core/user_dashboard_master.html' %}
{% block title %}Referral Link{% endblock %}
{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
            <h4 class="mb-sm-0">Referral Link</h4>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-xl-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-3">Your Referral Code</h5>
                <div class="d-flex align-items-center gap-2">
                    <h4 class="mb-0" id="referralCode">{{ request.user.referral_code }}</h4>
                    <button type="button" class="btn btn-sm btn-primary" onclick="copyText('referralCode', this)">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-3">Direct Register Link</h5>
                <div class="input-group">
                    <input type="text" class="form-control" id="directLink" value="{{ direct_link }}" readonly>
                    <button type="button" class="btn btn-primary" onclick="copyText('directLink', this)">Copy</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function copyText(elementId, button) {
    var element = document.getElementById(elementId);
    var value = element.tagName === "INPUT" ? element.value : element.textContent.trim();

    navigator.clipboard.writeText(value).then(function () {
        var originalText = button.textContent;
        button.textContent = "Copied";
        setTimeout(function () {
            button.textContent = originalText;
        }, 1200);
    });
}
</script>
{% endblock %}
