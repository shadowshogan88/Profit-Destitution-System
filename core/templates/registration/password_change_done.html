{% extends 'core/user_dashboard_master.html' %}
{% block title %}Password Updated{% endblock %}
{% block dashboard_content %}
<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between bg-galaxy-transparent">
            <h4 class="mb-sm-0">Password Updated</h4>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card">
            <div class="card-body text-center py-5">
                <div class="avatar-sm mx-auto mb-4">
                    <div class="avatar-title bg-success-subtle text-success rounded-circle fs-24">
                        <i class="ri-check-line"></i>
                    </div>
                </div>
                <h5 class="mb-2">Password Changed Successfully</h5>
                <p class="text-muted mb-4">Your new password is now active.</p>
                <a href="{% url 'page-profile' %}" class="btn btn-primary">Back to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
