{% load static %}
<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="dark" data-sidebar="dark" data-sidebar-size="lg" data-sidebar-image="none" data-preloader="disable" data-theme="dark" data-theme-colors="dark">
<head>
    <meta charset="utf-8" />
    <title>Sign In | Referral System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Referral system user login" name="description" />
    <meta content="Referral System" name="author" />

    <script src="{% static 'assets/js/layout.js' %}"></script>
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'assets/css/custom.min.css' %}" rel="stylesheet" type="text/css" />
</head>
<body data-bs-theme="dark">
    <div class="auth-page-wrapper pt-2">
        <div class="auth-one-bg-position auth-one-bg" id="auth-particles">
            <div class="bg-overlay"></div>
            <div class="shape">
                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 120">
                    <path d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
                </svg>
            </div>
        </div>

        <div class="auth-page-content">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="text-center mt-sm-2 mb-3 text-white-50">
                            <!-- <div>
                                <a href="/" class="d-inline-block auth-logo">
                                    <img src="{% static 'assets/images/logo.png' %}" alt="Logo" height="200">
                                </a>
                            </div> -->
                            <!-- <p class="mt-3 fs-15 fw-medium">User Dashboard</p> -->
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6 col-xl-5">
                        <div class="card mt-2 card-bg-fill bg-dark text-light border-secondary">
                            
                            <div class="card-body p-4">
                                 <div class="text-center mt-2">
                                <a href="/" class="d-inline-block auth-logo">
                                    <img src="{% static 'assets/images/logo.png' %}" alt="Logo" height="180">
                                </a>
                                </div>
                                <div class="text-center mt-2">
                                    <h5 class="text-primary">Welcome Back !</h5>
                                    <!-- <p class="text-light-emphasis">Sign in to continue</p> -->
                                </div>

                                <div class="p-2 mt-4">
                                    {% if form.errors %}
                                        <div class="alert alert-danger" role="alert">
                                            Invalid username or password.
                                        </div>
                                    {% endif %}

                                    <form method="post">
                                        {% csrf_token %}
                                        {% if next %}
                                            <input type="hidden" name="next" value="{{ next }}">
                                        {% endif %}

                                        <div class="mb-3">
                                            <label for="username" class="form-label text-light">Username</label>
                                            <input
                                                type="text"
                                                class="form-control"
                                                id="username"
                                                name="username"
                                                placeholder="Enter username"
                                                autocomplete="username"
                                                required
                                            >
                                        </div>

                                        <div class="mb-3">
                                            <div class="float-end">
                                                <a href="{% url 'password_reset' %}" class="text-light-emphasis">Forgot password?</a>
                                            </div>
                                            <label class="form-label text-light" for="password-input">Password</label>
                                            <div class="position-relative auth-pass-inputgroup mb-3">
                                                <input
                                                    type="password"
                                                    class="form-control pe-5 password-input"
                                                    placeholder="Enter password"
                                                    id="password-input"
                                                    name="password"
                                                    autocomplete="current-password"
                                                    required
                                                >
                                                <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon material-shadow-none" type="button" id="password-addon">
                                                    <i class="ri-eye-fill align-middle"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="" id="auth-remember-check">
                                            <label class="form-check-label text-light" for="auth-remember-check">Remember me</label>
                                        </div>

                                        <div class="mt-4">
                                            <button class="btn btn-success w-100" type="submit">Sign In</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <p class="mb-0">Don't have an account ? <a href="{% url 'referral-entry' %}" class="fw-semibold text-primary text-decoration-underline">Signup</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="text-center">
                            <p class="mb-0 text-muted">&copy;
                                <script>document.write(new Date().getFullYear())</script>
                                Digital Assets Trade International Crafted with <i class="mdi mdi-heart text-danger"></i> by SynckBD
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="{% static 'assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'assets/libs/node-waves/waves.min.js' %}"></script>
    <script src="{% static 'assets/libs/feather-icons/feather.min.js' %}"></script>
    <script src="{% static 'assets/js/pages/plugins/lord-icon-2.1.0.js' %}"></script>
    <script src="{% static 'assets/js/plugins.js' %}"></script>
    <script src="{% static 'assets/libs/particles.js/particles.js' %}"></script>
    <script src="{% static 'assets/js/pages/particles.app.js' %}"></script>
    <script src="{% static 'assets/js/pages/password-addon.init.js' %}"></script>
</body>
</html>
