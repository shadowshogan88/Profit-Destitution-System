{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="stylesheet" href="{% static 'core/login.css' %}">
</head>
<body>
    <main class="page">
        <section class="card">
            {% if validlink %}
                <h1>Set New Password</h1>
                <form method="post" class="login-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Update Password</button>
                </form>
            {% else %}
                <h1>Invalid Link</h1>
                <p class="subtitle">This reset link is invalid or expired.</p>
            {% endif %}
            <p class="subtitle" style="margin-top:12px;">
                <a href="{% url 'login' %}" style="color:#19c37d;">Back to login</a>
            </p>
        </section>
    </main>
</body>
</html>
